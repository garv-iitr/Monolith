<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MONOLITH Complete Hardware Datapath Schematic</title>
<style>
  /* Pure pitch-black CAD palette by default; clean white Light theme optional */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; background: #000000; color: #f5f5f5; }
  .app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 9px 14px;
    background: #0a0a0a; border-bottom: 1px solid #262626; z-index: 30;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.4px; color: #ffffff; display: flex; align-items: center; white-space: nowrap; padding-right: 4px; }

  .seg-group { display: inline-flex; border: 1px solid #333333; border-radius: 7px; overflow: hidden; background: #141414; }
  .seg-btn {
    padding: 5px 10px; font-size: 12.5px; font-weight: 600; border: none; background: transparent;
    color: #a3a3a3; cursor: pointer; transition: all 0.14s; white-space: nowrap;
  }
  .seg-btn.active { background: #f5f5f5; color: #000000; }
  .seg-btn:hover:not(.active) { background: #262626; color: #ffffff; }

  .btn {
    padding: 5px 11px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
    border: 1px solid #333333; background: #141414; color: #e5e5e5; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #262626; border-color: #52525b; color: #ffffff; }
  .btn.primary { background: #f5f5f5; border-color: #f5f5f5; color: #000000; }
  .btn.primary:hover { background: #d4d4d4; border-color: #d4d4d4; }

  .search-wrap { position: relative; min-width: 240px; flex: 1 1 240px; max-width: 340px; }
  .search-input {
    width: 100%; padding: 5px 10px; font-size: 12.5px; border-radius: 6px;
    border: 1px solid #333333; background: #000000; color: #f5f5f5;
  }
  .search-input:focus { outline: none; border-color: #a3a3a3; }
  .search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; max-height: 280px; overflow-y: auto;
    background: #0a0a0a; border: 1px solid #333333; border-radius: 7px; margin-top: 4px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.75); display: none; z-index: 60;
  }
  .search-item { padding: 7px 10px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid #1f1f1f; display: flex; justify-content: space-between; gap: 8px; color: #e5e5e5; }
  .search-item:hover { background: #1f1f1f; }

  .subbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 14px; background: #050505; border-bottom: 1px solid #222222; font-size: 12px;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .leg-item {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #d4d4d4;
    background: #0d0d0f; border: 1px solid #262626; border-radius: 6px; padding: 3px 8px;
    cursor: pointer; font-size: 12px; transition: all 0.14s;
  }
  .leg-item:hover { border-color: #52525b; color: #ffffff; }
  .leg-item.active-dom { background: #1e293b; border-color: #e2e8f0; color: #ffffff; }
  .leg-swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .stage-jumps { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .btn.active-stage { border-color: #f5f5f5; background: #262626; color: #ffffff; box-shadow: inset 0 -2px 0 #38bdf8; }

  .workspace { position: relative; flex: 1 1 auto; display: flex; overflow: hidden; background: #000000; }
  .viewport { flex: 1 1 auto; position: relative; overflow: hidden; cursor: grab; user-select: none; }
  .viewport:active { cursor: grabbing; }
  .stage-transform { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

  .minimap {
    position: absolute; right: 14px; bottom: 14px; width: 256px; padding: 7px 8px; border-radius: 9px;
    background: rgba(10, 12, 16, 0.92); border: 1px solid #333842; z-index: 22;
    box-shadow: 0 10px 28px rgba(0,0,0,0.75); backdrop-filter: blur(6px);
  }
  .mm-hdr { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #a3a3a3; margin-bottom: 4px; font-weight: 600; }
  .mm-svg { display: block; width: 240px; height: 50px; background: #040507; border-radius: 5px; border: 1px solid #262930; cursor: crosshair; }

  .inspector {
    width: 370px; max-width: 92vw; background: #0a0a0a; border-left: 1px solid #262626;
    padding: 14px; overflow-y: auto; display: none; flex-direction: column; gap: 12px; z-index: 25;
  }
  .inspector.open { display: flex; }
  .insp-card { background: #141414; border: 1px solid #2e2e2e; border-radius: 8px; padding: 10px; }
  .insp-h { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
  .insp-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #d4d4d4; line-height: 1.5; word-break: break-word; }
  .code-btn { display: inline-block; padding: 5px 9px; margin-right: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; border-radius: 5px; text-decoration: none; background: #f5f5f5; color: #000000; }
  .code-btn.alt { background: #262626; color: #f5f5f5; border: 1px solid #404040; }

  .wire-tooltip {
    position: fixed; pointer-events: none; z-index: 80; display: none; min-width: 240px; max-width: 360px;
    padding: 10px 12px; border-radius: 8px; background: rgba(10, 10, 10, 0.96);
    border: 1px solid #404040; box-shadow: 0 10px 25px rgba(0,0,0,0.75); color: #f5f5f5; font-size: 12.5px;
  }
  .tt-row { margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #d4d4d4; }

  .svg-title { fill: #fafafa; }

  .svg-mono { fill: #d4d4d4; }

<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">MONOLITH Datapath</div>

    <div class="seg-group" id="layoutToggle">
      <button class="seg-btn active" data-layout="6stage">6-Stage (IF-OF-EX-MEMCHK-MA-RW)</button>
      <button class="seg-btn" data-layout="4stage">4-Stage (IF-OF-EX-MA/RW)</button>
    </div>

    <div class="seg-group" id="romToggle">
      <button class="seg-btn active" data-rom="H">48b Horizontal ROM</button>
      <button class="seg-btn" data-rom="V">24b Vertical ROM</button>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="searchBox" type="text" autocomplete="off"
             placeholder="Search signal, memory, stack, register, mux..." />
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <button class="btn" id="btnInspector" title="Toggle Component Inspector Sidebar">Inspector</button>
    <button class="btn" id="btnTheme" title="Toggle Pitch-Black Dark / Light Theme">Theme</button>
    <button class="btn" id="btnExportSvg" title="Download Clean Vector SVG">Export SVG</button>
    <button class="btn primary" id="btnExportPng" title="Download High-Res 2x PNG">Export PNG</button>
  </div>

  <div class="subbar">
    <div class="legend"><button type="button" class="leg-item" data-sig="data" title="Click to isolate Integer / Inst / RAM Data"><span class="leg-swatch" style="background:#3b82f6;"></span>Integer / Inst / RAM Data</button>
<button type="button" class="leg-item" data-sig="fpu" title="Click to isolate IEEE-754 FPU Domain"><span class="leg-swatch" style="background:#06b6d4;"></span>IEEE-754 FPU Domain</button>
<button type="button" class="leg-item" data-sig="ctrl" title="Click to isolate Control ROM &amp; Decode"><span class="leg-swatch" style="background:#10b981;"></span>Control ROM &amp; Decode</button>
<button type="button" class="leg-item" data-sig="fwd" title="Click to isolate RAW Forwarding Bypass"><span class="leg-swatch" style="background:#f59e0b;"></span>RAW Forwarding Bypass</button>
<button type="button" class="leg-item" data-sig="hazard" title="Click to isolate Stall / Bubble / Branch Flush"><span class="leg-swatch" style="background:#ef4444;"></span>Stall / Bubble / Branch Flush</button>
<button type="button" class="leg-item" data-sig="safety" title="Click to isolate StackGuard &amp; Shadow Stack"><span class="leg-swatch" style="background:#a855f7;"></span>StackGuard &amp; Shadow Stack</button></div>
    <div class="stage-jumps">
      <span>Jump:</span>
      <button class="btn" data-jump="ALL">Fit All</button>
      <button class="btn" data-jump="IF">IF</button>
      <button class="btn" data-jump="OF">OF</button>
      <button class="btn" data-jump="EX">EX</button>
      <button class="btn" data-jump="MEMCHK">MEMCHK</button>
      <button class="btn" data-jump="MA">MA</button>
      <button class="btn" data-jump="RW">RW</button>
      <button class="btn" id="btnZoomOut">-</button>
      <span id="zoomPct" style="min-width:44px;text-align:center;font-weight:700;">86%</span>
      <button class="btn" id="btnZoomIn">+</button>
    </div>
  </div>

  <div class="workspace">
    <div class="viewport" id="viewport">
      <div class="stage-transform" id="stageTransform">
        <svg id="datapathSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7185 1528" width="7185" height="1528" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;">

  function updateViewportHud() {
    const vw = viewport.clientWidth || 1200;
    const vh = viewport.clientHeight || 700;
    const vx = -state.tx / state.scale;
    const vy = -state.ty / state.scale;
    const vwidth = vw / state.scale;
    const vheight = vh / state.scale;
    if (mmVp) {
      mmVp.setAttribute('x', Math.max(0, vx).toFixed(1));
      mmVp.setAttribute('y', Math.max(0, vy).toFixed(1));
      mmVp.setAttribute('width', Math.min(DATA.canvas.w, vwidth).toFixed(1));
      mmVp.setAttribute('height', Math.min(DATA.canvas.h, vheight).toFixed(1));
    }
    const cx = vx + vwidth / 2;
    let bestSt = 'IF', bestDist = Infinity;
    for (const sid of stageIdsOrdered) {
      const b = DATA.stageBoxes[sid];
      if (!b) continue;
      const d = Math.abs((b.x + b.w / 2) - cx);
      if (d < bestDist) { bestDist = d; bestSt = sid; }
    }
    document.querySelectorAll('[data-jump]').forEach(btn => {
      btn.classList.toggle('active-stage', vwidth < DATA.canvas.w * 0.85 && btn.dataset.jump === bestSt);

    }
  }

  function applyTransform() {
    stageXform.style.transform = `translate(${state.tx.toFixed(1)}px, ${state.ty.toFixed(1)}px) scale(${state.scale.toFixed(4)})`;

  function fitAll() {
    const vw = viewport.clientWidth || 1200;
    const vh = viewport.clientHeight || 700;
    const s = Math.min((vw - 32) / DATA.canvas.w, (vh - 32) / DATA.canvas.h);
    state.scale = Math.max(0.16, Math.min(1.5, s));
    state.tx = Math.max(12, (vw - DATA.canvas.w * state.scale) / 2);
    state.ty = Math.max(12, (vh - DATA.canvas.h * state.scale) / 2);
    applyTransform();
  }

  function jumpToRect(rx, ry, rw, rh, targetScale = null) {
    const vw = viewport.clientWidth || 1200;
    const vh = viewport.clientHeight || 700;
    let sc = targetScale;
    if (!sc) {

  }
  for (const [bid, b] of Object.entries(DATA.buses)) {
    searchIndex.push({ kind: 'Signal', id: bid, label: `${bid} — ${b.label} (${b.from} -> ${b.to})`, rect: { x: b.cx - 80, y: b.cy - 40, w: 160, h: 80 }, stage: b.type });
  }

  function clearHighlights() {
    svgEl.querySelectorAll('.search-hit').forEach(el => el.classList.remove('search-hit'));
  }

  function selectSearchMatch(item) {
    clearHighlights();
    const domEl = document.getElementById(item.kind === 'Signal' ? `pill-${item.id}` : `block-${item.id}`);
    if (domEl) domEl.classList.add('search-hit');
    if (item.kind === 'Signal') {
      const wg = document.getElementById(`wire-${item.id}`);
      if (wg) wg.classList.add('search-hit');
      openWireInspector(item.id);
    } else {
      openInspector(item.id);
    }
    jumpToRect(item.rect.x, item.rect.y, item.rect.w, item.rect.h, 1.0);
    searchDrop.style.display = 'none';
  }

  searchBox.addEventListener('input', () => {
    const q = searchBox.value.trim().toLowerCase();
    if (!q) { searchDrop.style.display = 'none'; clearHighlights(); return; }
    const hits = searchIndex.filter(it => it.label.toLowerCase().includes(q)).slice(0, 14);
    if (!hits.length) { searchDrop.style.display = 'none'; return; }
    searchDrop.innerHTML = hits.map((h, i) =>
      `<div class="search-item" data-idx="${i}"><span>${esc(h.label)}</span><span style="opacity:0.65;">${esc(h.kind)}</span></div>`
    ).join('');
    searchDrop.style.display = 'block';
    searchDrop.querySelectorAll('.search-item').forEach((row, idx) => {
      row.onclick = () => selectSearchMatch(hits[idx]);
    });
  });
  searchBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const q = searchBox.value.trim().toLowerCase();
      const first = searchIndex.find(it => it.label.toLowerCase().includes(q));
      if (first) selectSearchMatch(first);
    }
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchDrop.style.display = 'none';
  });

  // Inspector drawer with auto-resolved C++ file/line links
  function renderWelcomeInspector() {
    state.selectedId = null;
    inspTitle.textContent = 'Component Inspector';
    const quickIds = ['imem', 'dmem', 'stack_mem', 'gpr_rf', 'fpr_rf', 'pc_reg', 'control_rom', 'stack_guard'];
    const quickBtns = quickIds.filter(q => DATA.nodes[q]).map(q =>
      `<button class="code-btn alt insp-jump" data-tid="${q}" style="cursor:pointer;margin-bottom:4px;">${esc(DATA.nodes[q].title)}</button>`
    ).join('');
    inspBody.innerHTML = `
      <div class="insp-card">
        <div class="insp-h">MONOLITH 32-bit Hardware</div>
        <div class="insp-mono">Click any block, memory space, register bank, pipeline latch, or wire in the datapath to inspect what it does, its signal connections, and live C++ source links.</div>
      </div>
      <div class="insp-card">
        <div class="insp-h">Memory &amp; Register Spaces</div>
        <div class="insp-mono">
          &bull; Instruction Memory: <strong>0x00000 - 0x00FFF</strong> (4 KiB)<br>
          &bull; Data Memory: <strong>0x01000 - 0x1EFFF</strong> (120 KiB)<br>
          &bull; Stack Memory: <strong>0x1F000 - 0x20000</strong> (4 KiB, SP Top)<br>
          &bull; Registers: <strong>PC (32b)</strong>, <strong>R0-R15</strong>, <strong>F0-F15</strong>, <strong>NZCV</strong>
        </div>
        <div style="margin-top:8px;">${quickBtns}</div>
      </div>`;
    inspBody.querySelectorAll('.insp-jump').forEach(btn => {
      btn.onclick = () => {
        const tid = btn.dataset.tid;
        const n = DATA.nodes[tid];
        if (n) {
          clearHighlights();
          const el = document.getElementById(`block-${tid}`);
          if (el) el.classList.add('search-hit');
          openInspector(tid);
          jumpToRect(n.rect.x, n.rect.y, n.rect.w, n.rect.h, 0.92);
        }
      };
    });
  }

  function openWireInspector(busId) {
    const b = DATA.buses[busId];
    if (!b) return;
    inspector.classList.add('open');
    inspTitle.textContent = `${b.label}`;
    const fromId = b.from.split('.')[0];
    const toId = b.to.split('.')[0];
    const tapsHtml = (b.taps && b.taps.length)
      ? `<br>Taps: <strong>${esc(b.taps.join(', '))}</strong>`
      : '';
    inspBody.innerHTML = `
      <div class="insp-card">
        <div class="insp-h">Signal Bus Details</div>
        <div class="insp-mono">
          Domain: <strong>${esc(b.domain)}</strong><br>
          Width: <strong>${b.width} bits</strong><br>
          Source: <strong>${esc(b.from)}</strong><br>
          Destination: <strong>${esc(b.to)}</strong>${tapsHtml}
        </div>
        <div style="margin-top:8px;">
          ${DATA.nodes[fromId] ? `<button class="code-btn insp-node-btn" data-nid="${fromId}" style="cursor:pointer;">Inspect ${esc(DATA.nodes[fromId].title)}</button>` : ''}
          ${DATA.nodes[toId] ? `<button class="code-btn alt insp-node-btn" data-nid="${toId}" style="cursor:pointer;">Inspect ${esc(DATA.nodes[toId].title)}</button>` : ''}
        </div>
      </div>`;
    inspBody.querySelectorAll('.insp-node-btn').forEach(btn => {
      btn.onclick = () => openInspector(btn.dataset.nid);
    });
  }

  function openInspector(id) {
    const n = DATA.nodes[id];
    if (!n) return;
    state.selectedId = id;
    inspector.classList.add('open');
    inspTitle.textContent = n.title;
    const lk = n.link;
    let htmlStr = '';

    if (n.description) {
      htmlStr += `<div class="insp-card"><div class="insp-h">What It Does</div><div class="insp-mono">${esc(n.description)}</div></div>`;
    }

    if (n.mem_region) {
      htmlStr += `<div class="insp-card"><div class="insp-h">Memory Partition</div><div class="insp-mono">Segment: <strong>${esc(n.mem_region.segment)}</strong><br>Address Range: <strong>${esc(n.mem_region.range)}</strong><br>Capacity / Mode: <strong>${esc(n.mem_region.size)}</strong></div></div>`;
    }

    if (n.reg_cells && n.reg_cells.length) {
      htmlStr += `<div class="insp-card"><div class="insp-h">Architectural Registers (${n.reg_cells.length})</div><div class="insp-mono">${n.reg_cells.map(c => esc(c)).join(' | ')}</div></div>`;
    }

    htmlStr += `
      <div class="insp-card">
        <div class="insp-h">Source Definition</div>
        <div class="insp-mono">Stage: <strong>${esc(n.stage)}</strong> &nbsp;|&nbsp; ID: <code>${esc(n.id)}</code><br>
        Symbol: <strong>${esc(lk.symbol)}</strong><br>
        File: <strong>${esc(lk.file)} : L${lk.start_line}-L${lk.end_line}</strong></div>
        <div>
          <a class="code-btn" href="${lk.vscode_uri}">Open VS Code</a>
          <a class="code-btn alt" href="${lk.file_uri}" target="_blank">Open File URI</a>
        </div>
      </div>`;

    if (n.lines && n.lines.length) {
      htmlStr += `<div class="insp-card"><div class="insp-h">Hardware Behavior &amp; Selectors</div><div class="insp-mono">${n.lines.map(l => '&bull; ' + esc(l)).join('<br>')}${n.sel ? '<br><strong>sel:</strong> ' + esc(n.sel) : ''}</div></div>`;
    }

    if (n.kind === 'latch' && n.fields.length) {
      htmlStr += `<div class="insp-card"><div class="insp-h">Synchronous Latch Fields (${n.fields.length})</div><div class="insp-mono">${n.fields.map(f =>
        `<strong>${esc(f.name)} [${f.width}b]</strong> (${esc(f.signal_type)})<br>&nbsp;&nbsp;in: ${esc(f.producer)} -&gt; out: ${esc(f.consumers.join(', '))}`
      ).join('<br>')}</div></div>`;
    } else {
      const pList = Object.entries(n.ports).map(([pk, pw]) => `<code>${esc(pk)}</code> [${pw}b]`).join('<br>');
      htmlStr += `<div class="insp-card"><div class="insp-h">Validated Signal Ports</div><div class="insp-mono">${pList}</div></div>`;
    }

    if (id === 'control_rom') {
      const fmtKey = state.rom === 'V' ? 'vertical_24b' : 'horizontal_48b';
      const cw = DATA.controlWords[fmtKey];
      const cwl = DATA.cwLinks[fmtKey];
      htmlStr += `<div class="insp-card"><div class="insp-h">${esc(cw.cpp_struct)} (${cw.total_bits} bits)</div><div class="insp-mono">
        <a href="${cwl.vscode_uri}" style="color:#a3a3a3;">${esc(cwl.file)}:L${cwl.start_line}-L${cwl.end_line}</a><br><br>` +
        cw.fields.map(f => `${esc(f.bits.padEnd(8, ' '))} <strong>${esc(f.name)}</strong> (${f.width}b) &mdash; ${esc(f.desc)}`).join('<br>') +
        `</div></div>`;
    }
    inspBody.innerHTML = htmlStr;
  }

  // Connected wire highlight when hovering any block + click inspect
  const nodeBusMap = {};
  for (const [bid, b] of Object.entries(DATA.buses)) {
    const owners = new Set([b.from.split('.')[0], b.to.split('.')[0], ...(b.taps || []).map(t => t.split('.')[0])]);
    for (const ow of owners) {
      (nodeBusMap[ow] = nodeBusMap[ow] || []).push(bid);
    }
  }

  document.getElementById('btnCloseInsp').onclick = () => { inspector.classList.remove('open'); };
  svgEl.querySelectorAll('.hw-block').forEach(blk => {
    blk.addEventListener('mouseenter', () => {
      const list = nodeBusMap[blk.dataset.id] || [];
      for (const busId of list) {
        const wg = document.getElementById(`wire-${busId}`);
        const pg = document.getElementById(`pill-${busId}`);
        if (wg) wg.classList.add('conn-hi');
        if (pg) pg.classList.add('conn-hi');
      }
    });
    blk.addEventListener('mouseleave', () => {
      svgEl.querySelectorAll('.conn-hi').forEach(el => el.classList.remove('conn-hi'));
    });
    blk.addEventListener('click', (e) => {
      if (moved) return;
      e.stopPropagation();
      openInspector(blk.dataset.id);
    });
  });

  // Hover tooltips on every wire and wire pill (showing width, domain, src->dst & fan-out taps)
  function showWireTooltip(e, busId) {
    const b = DATA.buses[busId];
    if (!b) return;
    const tapsRow = (b.taps && b.taps.length)
      ? `<div class="tt-row">Taps: <strong>${esc(b.taps.join(', '))}</strong></div>`
      : '';
    tooltip.innerHTML = `
      <div style="font-weight:700;font-size:13.5px;color:${DATA.palette[b.type]};">${esc(b.label)}</div>
      <div class="tt-row">Width: <strong>${b.width}b</strong> &nbsp;|&nbsp; Domain: ${esc(b.domain)}</div>
      <div class="tt-row">From: <strong>${esc(b.from)}</strong></div>
      <div class="tt-row">To:   <strong>${esc(b.to)}</strong></div>
      ${tapsRow}`;
    tooltip.style.display = 'block';
    const x = Math.min(window.innerWidth - 375, e.clientX + 16);
    const y = Math.min(window.innerHeight - 165, e.clientY + 14);
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

  svgEl.querySelectorAll('.wire-group, .wire-pill').forEach(el => {
    el.addEventListener('mousemove', (e) => showWireTooltip(e, el.dataset.busId));
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    el.addEventListener('click', (e) => {
      if (moved) return;
      openWireInspector(el.dataset.busId);
    });
  });

  // Self-contained SVG & 2x HiDPI PNG Export (inline style injection guarantees 0 external dependencies)
  const ROLE_CSS_DARK = ".role-imem .blk-rect{fill:#06101f;stroke:#2563eb;} .role-imem .blk-hdr{fill:#0b1b36;stroke:#2563eb;} .role-imem .blk-acc{fill:#3b82f6;} .role-imem .mem-slot{fill:#04060a;stroke:#3b82f6;} .role-imem .reg-cell{fill:#050608;stroke:#2563eb;}.role-dmem .blk-rect{fill:#041118;stroke:#0284c7;} .role-dmem .blk-hdr{fill:#08202e;stroke:#0284c7;} .role-dmem .blk-acc{fill:#38bdf8;} .role-dmem .mem-slot{fill:#04060a;stroke:#38bdf8;} .role-dmem .reg-cell{fill:#050608;stroke:#0284c7;}.role-stack .blk-rect{fill:#120621;stroke:#9333ea;} .role-stack .blk-hdr{fill:#200c38;stroke:#9333ea;} .role-stack .blk-acc{fill:#a855f7;} .role-stack .mem-slot{fill:#04060a;stroke:#a855f7;} .role-stack .reg-cell{fill:#050608;stroke:#9333ea;}.role-gpr .blk-rect{fill:#140d03;stroke:#d97706;} .role-gpr .blk-hdr{fill:#241706;stroke:#d97706;} .role-gpr .blk-acc{fill:#f59e0b;} .role-gpr .mem-slot{fill:#04060a;stroke:#f59e0b;} .role-gpr .reg-cell{fill:#050608;stroke:#d97706;}.role-fpr .blk-rect{fill:#041317;stroke:#0891b2;} .role-fpr .blk-hdr{fill:#082229;stroke:#0891b2;} .role-fpr .blk-acc{fill:#06b6d4;} .role-fpr .mem-slot{fill:#04060a;stroke:#06b6d4;} .role-fpr .reg-cell{fill:#050608;stroke:#0891b2;}.role-flags .blk-rect{fill:#180609;stroke:#dc2626;} .role-flags .blk-hdr{fill:#2b0c12;stroke:#dc2626;} .role-flags .blk-acc{fill:#ef4444;} .role-flags .mem-slot{fill:#04060a;stroke:#ef4444;} .role-flags .reg-cell{fill:#050608;stroke:#dc2626;}.role-alu .blk-rect{fill:#070f1d;stroke:#2563eb;} .role-alu .blk-hdr{fill:#0b1930;stroke:#2563eb;} .role-alu .blk-acc{fill:#3b82f6;} .role-alu .mem-slot{fill:#04060a;stroke:#3b82f6;} .role-alu .reg-cell{fill:#050608;stroke:#2563eb;}.role-fpu .blk-rect{fill:#051418;stroke:#0891b2;} .role-fpu .blk-hdr{fill:#082229;stroke:#0891b2;} .role-fpu .blk-acc{fill:#06b6d4;} .role-fpu .mem-slot{fill:#04060a;stroke:#06b6d4;} .role-fpu .reg-cell{fill:#050608;stroke:#0891b2;}.role-ctrl .blk-rect{fill:#05140d;stroke:#059669;} .role-ctrl .blk-hdr{fill:#092317;stroke:#059669;} .role-ctrl .blk-acc{fill:#10b981;} .role-ctrl .mem-slot{fill:#04060a;stroke:#10b981;} .role-ctrl .reg-cell{fill:#050608;stroke:#059669;}.role-hazard .blk-rect{fill:#170709;stroke:#dc2626;} .role-hazard .blk-hdr{fill:#280b0f;stroke:#dc2626;} .role-hazard .blk-acc{fill:#ef4444;} .role-hazard .mem-slot{fill:#04060a;stroke:#ef4444;} .role-hazard .reg-cell{fill:#050608;stroke:#dc2626;}.role-fwd .blk-rect{fill:#160e04;stroke:#d97706;} .role-fwd .blk-hdr{fill:#261806;stroke:#d97706;} .role-fwd .blk-acc{fill:#f59e0b;} .role-fwd .mem-slot{fill:#04060a;stroke:#f59e0b;} .role-fwd .reg-cell{fill:#050608;stroke:#d97706;}.role-safety .blk-rect{fill:#11071e;stroke:#9333ea;} .role-safety .blk-hdr{fill:#1d0c33;stroke:#9333ea;} .role-safety .blk-acc{fill:#a855f7;} .role-safety .mem-slot{fill:#04060a;stroke:#a855f7;} .role-safety .reg-cell{fill:#050608;stroke:#9333ea;}.role-mux .blk-rect{fill:#0f1217;stroke:#64748b;} .role-mux .blk-hdr{fill:#181d25;stroke:#64748b;} .role-mux .blk-acc{fill:#94a3b8;} .role-mux .mem-slot{fill:#04060a;stroke:#94a3b8;} .role-mux .reg-cell{fill:#050608;stroke:#64748b;}";
  const ROLE_CSS_LIGHT = ".role-imem .blk-rect{fill:#eff6ff;stroke:#3b82f6;} .role-imem .blk-hdr{fill:#dbeafe;stroke:#3b82f6;} .role-imem .blk-acc{fill:#3b82f6;} .role-imem .mem-slot{fill:#ffffff;stroke:#3b82f6;} .role-imem .reg-cell{fill:#ffffff;stroke:#3b82f6;}.role-dmem .blk-rect{fill:#f0f9ff;stroke:#0284c7;} .role-dmem .blk-hdr{fill:#e0f2fe;stroke:#0284c7;} .role-dmem .blk-acc{fill:#38bdf8;} .role-dmem .mem-slot{fill:#ffffff;stroke:#38bdf8;} .role-dmem .reg-cell{fill:#ffffff;stroke:#0284c7;}.role-stack .blk-rect{fill:#faf5ff;stroke:#9333ea;} .role-stack .blk-hdr{fill:#f3e8ff;stroke:#9333ea;} .role-stack .blk-acc{fill:#a855f7;} .role-stack .mem-slot{fill:#ffffff;stroke:#a855f7;} .role-stack .reg-cell{fill:#ffffff;stroke:#9333ea;}.role-gpr .blk-rect{fill:#fffbeb;stroke:#d97706;} .role-gpr .blk-hdr{fill:#fef3c7;stroke:#d97706;} .role-gpr .blk-acc{fill:#f59e0b;} .role-gpr .mem-slot{fill:#ffffff;stroke:#f59e0b;} .role-gpr .reg-cell{fill:#ffffff;stroke:#d97706;}.role-fpr .blk-rect{fill:#ecfeff;stroke:#0891b2;} .role-fpr .blk-hdr{fill:#cffafe;stroke:#0891b2;} .role-fpr .blk-acc{fill:#06b6d4;} .role-fpr .mem-slot{fill:#ffffff;stroke:#06b6d4;} .role-fpr .reg-cell{fill:#ffffff;stroke:#0891b2;}.role-flags .blk-rect{fill:#fef2f2;stroke:#dc2626;} .role-flags .blk-hdr{fill:#fee2e2;stroke:#dc2626;} .role-flags .blk-acc{fill:#ef4444;} .role-flags .mem-slot{fill:#ffffff;stroke:#ef4444;} .role-flags .reg-cell{fill:#ffffff;stroke:#dc2626;}.role-alu .blk-rect{fill:#eff6ff;stroke:#2563eb;} .role-alu .blk-hdr{fill:#dbeafe;stroke:#2563eb;} .role-alu .blk-acc{fill:#3b82f6;} .role-alu .mem-slot{fill:#ffffff;stroke:#3b82f6;} .role-alu .reg-cell{fill:#ffffff;stroke:#2563eb;}.role-fpu .blk-rect{fill:#ecfeff;stroke:#0891b2;} .role-fpu .blk-hdr{fill:#cffafe;stroke:#0891b2;} .role-fpu .blk-acc{fill:#06b6d4;} .role-fpu .mem-slot{fill:#ffffff;stroke:#06b6d4;} .role-fpu .reg-cell{fill:#ffffff;stroke:#0891b2;}.role-ctrl .blk-rect{fill:#ecfdf5;stroke:#059669;} .role-ctrl .blk-hdr{fill:#d1fae5;stroke:#059669;} .role-ctrl .blk-acc{fill:#10b981;} .role-ctrl .mem-slot{fill:#ffffff;stroke:#10b981;} .role-ctrl .reg-cell{fill:#ffffff;stroke:#059669;}.role-hazard .blk-rect{fill:#fef2f2;stroke:#dc2626;} .role-hazard .blk-hdr{fill:#fee2e2;stroke:#dc2626;} .role-hazard .blk-acc{fill:#ef4444;} .role-hazard .mem-slot{fill:#ffffff;stroke:#ef4444;} .role-hazard .reg-cell{fill:#ffffff;stroke:#dc2626;}.role-fwd .blk-rect{fill:#fffbeb;stroke:#d97706;} .role-fwd .blk-hdr{fill:#fef3c7;stroke:#d97706;} .role-fwd .blk-acc{fill:#f59e0b;} .role-fwd .mem-slot{fill:#ffffff;stroke:#f59e0b;} .role-fwd .reg-cell{fill:#ffffff;stroke:#d97706;}.role-safety .blk-rect{fill:#faf5ff;stroke:#9333ea;} .role-safety .blk-hdr{fill:#f3e8ff;stroke:#9333ea;} .role-safety .blk-acc{fill:#a855f7;} .role-safety .mem-slot{fill:#ffffff;stroke:#a855f7;} .role-safety .reg-cell{fill:#ffffff;stroke:#9333ea;}.role-mux .blk-rect{fill:#f8fafc;stroke:#64748b;} .role-mux .blk-hdr{fill:#e2e8f0;stroke:#64748b;} .role-mux .blk-acc{fill:#94a3b8;} .role-mux .mem-slot{fill:#ffffff;stroke:#94a3b8;} .role-mux .reg-cell{fill:#ffffff;stroke:#64748b;}";
  function buildCleanExportSvgString() {
    const clone = svgEl.cloneNode(true);
    const isLight = document.body.classList.contains('light-theme');
    const styleNode = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    styleNode.textContent = isLight
      ? `.svg-title{fill:#0f172a;} .svg-mono{fill:#1e293b;} .svg-muted{fill:#475569;} .zone-band{fill:rgba(15,23,42,0.03);stroke:#cbd5e1;} .stage-bg{fill:#f1f5f9;stroke:#94a3b8;} .stage-hdr-bg{fill:#e2e8f0;stroke:#94a3b8;} .blk-rect{fill:#ffffff;stroke:#94a3b8;} .blk-hdr{fill:#f1f5f9;stroke:#94a3b8;} .mem-slot,.reg-cell{fill:#f8fafc;stroke:#94a3b8;} .latch-sep{stroke:#e2e8f0;} .pill-bg{fill:#ffffff;} .four-dim{opacity:0.24;} ${ROLE_CSS_LIGHT}`
      : `.svg-title{fill:#fafafa;} .svg-mono{fill:#d4d4d4;} .svg-muted{fill:#a3a3a3;} .zone-band{fill:rgba(255,255,255,0.02);stroke:#2e2e2e;} .stage-bg{fill:#060606;stroke:#303030;} .stage-hdr-bg{fill:#101216;stroke:#34373d;} .blk-rect{fill:#0a0a0a;stroke:#404040;} .blk-hdr{fill:#141414;stroke:#404040;} .mem-slot,.reg-cell{fill:#050505;stroke:#404040;} .latch-sep{stroke:#1f242d;} .pill-bg{fill:#000000;} .four-dim{opacity:0.24;} ${ROLE_CSS_DARK}`;
    clone.insertBefore(styleNode, clone.firstChild);
    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('width', '100%');
    bgRect.setAttribute('height', '100%');
    bgRect.setAttribute('fill', isLight ? '#f8fafc' : '#000000');
    clone.insertBefore(bgRect, styleNode.nextSibling);
    return new XMLSerializer().serializeToString(clone);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  document.getElementById('btnExportSvg').onclick = () => {
    const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + buildCleanExportSvgString();
    downloadBlob(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), `monolith_datapath_${state.layout}.svg`);
  };

  document.getElementById('btnExportPng').onclick = () => {
    const xml = buildCleanExportSvgString();
    const img = new Image();
    const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    img.onload = () => {
      const scale = 2;
      const c = document.createElement('canvas');
      c.width = Math.round(DATA.canvas.w * scale);
      c.height = Math.round(DATA.canvas.h * scale);
      const ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob(png => {
        if (png) downloadBlob(png, `monolith_datapath_${state.layout}.png`);
      }, 'image/png');
    };
    img.src = url;
  };

  // Initial boot: position top highways & Stage 1-2 cleanly inside viewport + welcome inspector
  updateArchitectureUI();
  updateRomUI();
  renderWelcomeInspector();
  state.scale = 0.84;
  state.tx = 14;
  state.ty = 12;
  applyTransform();
})();
